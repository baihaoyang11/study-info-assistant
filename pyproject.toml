[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-mail-agent"
version = "0.2.0"
description = "Read-only QQ text collection and local academic checklists"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
academic-mail-agent = "academic_mail_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
